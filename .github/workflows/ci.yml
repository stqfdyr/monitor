name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or a linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A test that hangs rather than fails would otherwise sit here burning the
    # six-hour default. A cold build plus the suite is a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than leaving it to build.rs so
      # the download happens on the runner: release builds go through cross,
      # and that container is not guaranteed to carry curl.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed needs the panel's dist/ to exist before cargo touches it.
      - run: npm ci && npm run lint && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # development.md asks for `cargo fmt`; eight spots had drifted anyway.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
